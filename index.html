<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Wear | Full Functional System</title>
    <style>
        @font-face {
            font-family: 'Persona5Menu';
            src: url('Persona5MenuFontPrototype-Regular.ttf') format('truetype');
        }

        /* ESTILOS BASE */
        body { font-family: 'Arial Black', sans-serif; background-color: #000; color: #fff; margin: 0; overflow-x: hidden; }
        .hidden { display: none !important; }

        /* LOGIN */
        #tela-login { height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(45deg, #000 70%, #d10000 70.1%); }
        .login-box { background: #fff; padding: 40px; border: 8px solid #000; transform: rotate(-2deg); box-shadow: 15px 15px 0 #d10000; width: 350px; }
        .login-box h2 { font-family: 'Persona5Menu', sans-serif; text-align: center; background: #d10000; color: #fff; padding: 10px; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 3px solid #000; box-sizing: border-box; font-weight: bold; }
        .btn-login { width: 100%; padding: 15px; background: #d10000; color: #fff; border: none; font-weight: 900; cursor: pointer; clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%); }

        /* ADMIN */
        #tela-admin { display: flex; min-height: 100vh; }
        nav { width: 260px; background: #d10000; border-right: 5px solid #fff; position: fixed; height: 100vh; z-index: 10; }
        .admin-logo { font-family: 'Persona5Menu', sans-serif; font-size: 26px; padding: 25px; background: #000; margin: 15px; border: 2px solid #fff; transform: rotate(-3deg); }
        nav ul { list-style: none; padding: 0; }
        nav li { padding: 20px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.2); text-transform: uppercase; }
        nav li:hover, nav li.active { background: #fff; color: #d10000; }
        main.admin-content { flex-grow: 1; padding: 50px; margin-left: 260px; }
        
        .table-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-salvar { background: #28a745; color: #fff; border: 4px solid #fff; padding: 10px 20px; font-weight: 900; cursor: pointer; display: none; transform: skewX(-10deg); }
        
        .table-box { background: #1a1a1a; padding: 25px; border: 3px solid #d10000; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #d10000; border-bottom: 3px solid #fff; padding: 12px; }
        td { padding: 12px; border-bottom: 1px solid #333; }
        
        /* CONTROLES DE ESTOQUE */
        .estoque-ctrl { display: flex; align-items: center; gap: 10px; }
        .btn-qty { background: #fff; border: 2px solid #000; width: 30px; height: 30px; font-weight: bold; cursor: pointer; }
        .btn-qty:hover { background: #d10000; color: #fff; }
        .status-critico { color: #d10000; font-weight: bold; animation: pulse 1s infinite; }

        /* CLIENTE */
        header { background: #d10000; padding: 20px; display: flex; justify-content: space-between; border-bottom: 5px solid #fff; position: sticky; top: 0; z-index: 100; }
        .logo { font-family: 'Persona5Menu', sans-serif; font-size: 32px; background: #000; padding: 5px 20px; border: 2px solid #fff; transform: rotate(-2deg); }
        .vitrine-container { display: flex; padding: 20px; }
        aside li { padding: 15px; cursor: pointer; transition: 0.3s; border-bottom: 1px solid #333; text-transform: uppercase; }
        aside li:hover, aside li.active-filter { color: #d10000; background: #222; padding-left: 25px; }
        
        .grid-produtos { flex-grow: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; padding-left: 30px; }
        .produto-card { background: #fff; color: #000; padding: 20px; text-align: center; border: 5px solid #000; transition: 0.3s; }
        .btn-comprar { background: #d10000; color: #fff; border: none; padding: 15px; width: 100%; cursor: pointer; font-weight: 900; clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%); transition: 0.2s; }
        .btn-comprar:hover { background: #000; transform: skewX(-5deg); }

        /* NOTIFICAÇÃO */
        .notificacao { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: #d10000; color: #fff; padding: 20px 50px; border: 4px solid #fff; z-index: 1000; transition: 0.5s; font-family: 'Persona5Menu'; text-align: center; }
        .notificacao.ativo { top: 20px; }

        @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="notificacao" class="notificacao">SISTEMA ATUALIZADO!</div>

    <section id="tela-login">
        <div class="login-box">
            <h2>ACCESSS_SYSTEM</h2>
            <input type="text" id="login-email" placeholder="E-MAIL">
            <input type="password" id="login-senha" placeholder="SENHA">
            <button class="btn-login" onclick="autenticar()">INFILTRAR-SE</button>
        </div>
    </section>

    <section id="tela-admin" class="hidden">
        <nav>
            <div class="admin-logo">PHANTOM ADMIN</div>
            <ul><li class="active">Estoque</li><li onclick="logout()">Sair</li></ul>
        </nav>
        <main class="admin-content">
            <div class="table-header-flex">
                <h1 style="color:#d10000; font-family:'Persona5Menu'; font-size: 40px;">GERENCIAMENTO DE CARGA</h1>
                <button id="btn-salvar" class="btn-salvar" onclick="salvarEstoque()">SALVAR ALTERAÇÕES</button>
            </div>
            <div class="table-box">
                <table>
                    <thead><tr><th>Produto</th><th>Categoria</th><th>Quantidade</th><th>Status</th></tr></thead>
                    <tbody id="tabela-admin-corpo"></tbody>
                </table>
            </div>
        </main>
    </section>

    <section id="tela-cliente" class="hidden">
        <header>
            <div class="logo">PHANTOM WEAR</div>
            <button onclick="logout()" style="background:#000; color:#fff; border:1px solid #fff; padding:5px 15px; cursor:pointer;">SAIR</button>
        </header>
        <div class="vitrine-container">
            <aside style="width:200px">
                <h3 style="color:#d10000">FILTRAR</h3>
                <ul style="list-style:none; padding:0;">
                    <li onclick="filtrarProdutos('TODOS')" class="active-filter">TODOS</li>
                    <li onclick="filtrarProdutos('Camiseta')">CAMISETAS</li>
                    <li onclick="filtrarProdutos('Moletom')">MOLETONS</li>
                </ul>
            </aside>
            <main class="grid-produtos" id="vitrine-produtos"></main>
        </div>
    </section>

    <script>
        const produtos = [
            { id: 1, nome: "Camiseta Branca - Gorillaz", cat: "Camiseta", preco: 89.90, estoque: 20, img: "static/camiseta_demondays.png" },
            { id: 2, nome: "Moletom Branco - Gojo", cat: "Moletom", preco: 189.90, estoque: 3, img: "static/moletom_gojo.png" },
            { id: 3, nome: "Moletom Preto - Gemaplys", cat: "Moletom", preco: 199.90, estoque: 15, img: "static/moletom_chicken.png" },
            { id: 4, nome: "Moletom Branco - Yunli", cat: "Moletom", preco: 179.90, estoque: 7, img: "static/moletom_yunli.png" },
            { id: 5, nome: "Moletom Preto - Miles Morales", cat: "Moletom", preco: 210.00, estoque: 10, img: "static/moletom_spider.png" },
            { id: 6, nome: "Moletom Preto - Saiko", cat: "Moletom", preco: 195.00, estoque: 2, img: "static/moletom_saiko.png" },
            { id: 7, nome: "Camiseta Preta - JF Classics", cat: "Camiseta", preco: 109.90, estoque: 30, img: "static/camiseta_jf.png" },
            { id: 8, nome: "Camiseta Branca - Choso", cat: "Camiseta", preco: 99.90, estoque: 12, img: "static/camiseta_choso.png" },
            { id: 9, nome: "Camiseta Preta - Toji", cat: "Camiseta", preco: 119.90, estoque: 4, img: "static/camiseta_toji.png" },
            { id: 10, nome: "Camiseta Branca - Korn", cat: "Camiseta", preco: 89.90, estoque: 18, img: "static/camiseta_korn.png" }
        ];

        let alteracoesPendentes = false;

        function autenticar() {
            const email = document.getElementById('login-email').value;
            if (email === "empresa@phantom.com") {
                document.getElementById('tela-login').classList.add('hidden');
                document.getElementById('tela-admin').classList.remove('hidden');
                renderAdmin();
            } else if (email === "cliente@gmail.com") {
                document.getElementById('tela-login').classList.add('hidden');
                document.getElementById('tela-cliente').classList.remove('hidden');
                renderVitrine(produtos);
            }
        }

        // --- LÓGICA CLIENTE (FILTROS) ---
        function filtrarProdutos(categoria) {
            // Estilizar menu lateral
            document.querySelectorAll('aside li').forEach(li => {
                li.classList.remove('active-filter');
                if(li.innerText === categoria || (categoria === 'TODOS' && li.innerText === 'TODOS')) li.classList.add('active-filter');
            });

            if (categoria === 'TODOS') {
                renderVitrine(produtos);
            } else {
                const filtrados = produtos.filter(p => p.cat === categoria);
                renderVitrine(filtrados);
            }
        }

        function renderVitrine(lista) {
            const container = document.getElementById('vitrine-produtos');
            container.innerHTML = lista.map(p => `
                <div class="produto-card">
                    <img src="${p.img}" style="width:100%">
                    <h4>${p.nome}</h4>
                    <p>R$ ${p.preco.toFixed(2).replace('.', ',')}</p>
                    <button class="btn-comprar">COMPRAR</button>
                </div>
            `).join('');
        }

        // --- LÓGICA ADMIN (ESTOQUE) ---
        function renderAdmin() {
            const tbody = document.getElementById('tabela-admin-corpo');
            tbody.innerHTML = produtos.map(p => {
                const critico = p.estoque <= 5;
                return `
                    <tr>
                        <td>${p.nome}</td>
                        <td>${p.cat}</td>
                        <td>
                            <div class="estoque-ctrl">
                                <button class="btn-qty" onclick="alterarQtd(${p.id}, -1)">-</button>
                                <span id="qty-${p.id}">${p.estoque}</span>
                                <button class="btn-qty" onclick="alterarQtd(${p.id}, 1)">+</button>
                            </div>
                        </td>
                        <td id="status-${p.id}" class="${critico ? 'status-critico' : ''}">
                            ${critico ? 'CRÍTICO' : 'ESTÁVEL'}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function alterarQtd(id, delta) {
            const p = produtos.find(prod => prod.id === id);
            const novoValor = p.estoque + delta;
            
            if (novoValor >= 0) {
                p.estoque = novoValor;
                document.getElementById(`qty-${id}`).innerText = novoValor;
                
                // Atualizar Status visualmente
                const statusTd = document.getElementById(`status-${id}`);
                if (novoValor <= 5) {
                    statusTd.innerText = "CRÍTICO";
                    statusTd.classList.add('status-critico');
                } else {
                    statusTd.innerText = "ESTÁVEL";
                    statusTd.classList.remove('status-critico');
                }

                // Mostrar botão salvar
                alteracoesPendentes = true;
                document.getElementById('btn-salvar').style.display = 'block';
            }
        }

        function salvarEstoque() {
            const nota = document.getElementById('notificacao');
            nota.classList.add('ativo');
            document.getElementById('btn-salvar').style.display = 'none';
            alteracoesPendentes = false;
            
            setTimeout(() => { nota.classList.remove('ativo'); }, 2000);
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
